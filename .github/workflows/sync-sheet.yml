name: Sync case studies from Google Sheet

# Backup sync path — see README.md section 5.
# Live mode (data/sheet-config.json) already updates the site instantly on
# every page load, so this job is a safety net, not what makes edits show up.
# It just keeps data/case-studies.json fresh as a static fallback, in case:
#   - the Google Sheet ever goes private / is deleted / Google has an outage
#   - something needs to read the content without running JavaScript
#   - you want a version-controlled history of every content change, in Git

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run sheet sync
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          SETTINGS_CSV_URL: ${{ secrets.SETTINGS_CSV_URL }}
        run: python3 scripts/sheet_to_json.py

      - name: Commit updated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/case-studies.json; then
            echo "No changes to data/case-studies.json — nothing to commit."
          else
            git add data/case-studies.json
            git commit -m "chore: sync case studies from Google Sheet"
            git push
          fi
